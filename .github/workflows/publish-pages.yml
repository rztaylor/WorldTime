name: Publish Cloudflare Pages

on:
  push:
    branches:
      - release

permissions:
  contents: read

concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: true

jobs:
  publish:
    name: Build and publish
    # Pinned so a runner image change cannot break the Playwright OS-package install mid-release.
    runs-on: ubuntu-24.04
    environment: Live

    steps:
      - name: Check out release commit
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run release checks and build
        run: npm run check

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run browser checks
        run: npm run test:browser

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: bc55ee3751780a67f14ea978c717ff47
          command: pages deploy dist --project-name=world-time --branch=release
